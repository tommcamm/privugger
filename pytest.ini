[pytest]
# Mark tests that require PyTorch/Pyro
markers =
    pyro: Tests that use the Pyro backend
    slow: Tests that take a long time to run

# Set pytest default paths and other options
testpaths = privugger/test

# Disable pytest warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Default pytest arguments (verbose output, show test progress)
addopts = -v
